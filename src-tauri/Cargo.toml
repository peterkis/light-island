[package]
name = "samewave-island"
version = "0.1.0"
description = "Samewave hospital collaboration island - synthetic prototype"
edition = "2021"
rust-version = "1.85"

[lib]
name = "samewave_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
url = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"
